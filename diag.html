<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Check-in test</title>
<style>
  body { margin: 0; padding: 24px; background: #0d0d0d; color: #f3f3f3; font: 20px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 30px; }
  p { margin: 0 0 18px; color: #9c9c9c; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #2c2c2c; }
  .mark { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: #333; }
  .ok .mark { background: #1f9d5c; }
  .bad .mark { background: #E1000A; }
  .what { font-weight: 700; }
  .detail { font-size: 16px; color: #c9c9c9; word-break: break-word; }
  .bad .detail { color: #ff9a9a; }
</style>
</head>
<body>
<h1>Check-in test</h1>
<p>This runs each step the board's staff check-in needs. Take a photo of this page when it says Finished.</p>
<ol id="list"></ol>
<p id="end" style="margin-top:18px"></p>
<script src="config.js?v=diag"></script>
<script>
(function () {
  var list = document.getElementById('list');
  function row(what) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="mark">…</span><div><div class="what"></div><div class="detail"></div></div>';
    li.querySelector('.what').textContent = what;
    list.appendChild(li);
    return {
      ok: function (d) { li.className = 'ok'; li.querySelector('.mark').textContent = '✓'; li.querySelector('.detail').textContent = d || ''; },
      bad: function (d) { li.className = 'bad'; li.querySelector('.mark').textContent = '✗'; li.querySelector('.detail').textContent = d || ''; }
    };
  }
  function describe(e) { return e ? ((e.code || e.name || 'Error') + ': ' + (e.message || e)) : 'no details'; }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, no) { setTimeout(function () { no(new Error('No answer after ' + ms / 1000 + ' seconds')); }, ms); })]);
  }

  var errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message || (e.target && (e.target.src || e.target.href)) || 'error event'); }, true);

  async function run() {
    var r = row('Browser');
    r.ok(navigator.userAgent);

    r = row('Can run modules');
    var mod = 'noModule' in document.createElement('script');
    mod ? r.ok() : r.bad('This browser is too old for the check-in part');

    r = row('Settings file (config.js)');
    var cfg = window.TG_FIREBASE || {};
    cfg.apiKey && cfg.projectId ? r.ok('project ' + cfg.projectId) : r.bad('config.js did not load');

    r = row('Saved storage (localStorage)');
    try { localStorage.setItem('tg-diag', '1'); localStorage.removeItem('tg-diag'); r.ok(); }
    catch (e) { r.bad(describe(e)); }

    r = row('Random numbers (crypto.getRandomValues)');
    window.crypto && crypto.getRandomValues ? r.ok() : r.bad('not available');

    r = row('Download check-in code (staff.js)');
    try {
      var res = await withTimeout(fetch('staff.js?v=diag-' + Date.now()), 15000);
      var text = await res.text();
      res.ok ? r.ok('HTTP ' + res.status + ', ' + text.length + ' characters') : r.bad('HTTP ' + res.status);
    } catch (e) { r.bad(describe(e)); }

    // On this page staff.js has no board to attach to, so an error about a missing element means it read fine.
    r = row('Read the check-in code (staff.js)');
    try {
      var before = errors.length;
      await withTimeout(new Promise(function (yes, no) {
        var s = document.createElement('script');
        s.src = 'staff.js?v=diag-' + Date.now();
        s.onload = yes;
        s.onerror = function () { no(new Error("couldn't download it")); };
        document.body.appendChild(s);
      }), 30000);
      var problems = errors.slice(before).filter(function (m) { return !/null|undefined|insertBefore|querySelector/i.test(m); });
      problems.length ? r.bad(problems.join('; ')) : r.ok('read fine');
    } catch (e) { r.bad(describe(e)); }

    r = row('Reach the database');
    try {
      var db = await withTimeout(fetch('https://firestore.googleapis.com/v1/projects/' + cfg.projectId + '/databases/(default)/documents/board/content?key=' + cfg.apiKey), 20000);
      db.ok ? r.ok('HTTP ' + db.status) : r.bad('HTTP ' + db.status);
    } catch (e) { r.bad(describe(e)); }

    r = row('Reach the sign-in service');
    try {
      // An empty token request is refused (HTTP 400), which proves the service answers.
      var si = await withTimeout(fetch('https://securetoken.googleapis.com/v1/token?key=' + cfg.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=x' }), 20000);
      si.status === 400 || si.ok ? r.ok('answers') : r.bad('HTTP ' + si.status);
    } catch (e) { r.bad(describe(e)); }
    finish();
  }

  function finish() {
    var other = errors.filter(function (m) { return !/null|undefined|insertBefore|querySelector/i.test(m); });
    document.getElementById('end').textContent = 'Finished.' + (other.length ? ' Other errors: ' + other.join('; ') : '');
  }

  run().catch(function (e) { row('Test page itself').bad(describe(e)); finish(); });
})();
</script>
</body>
</html>
